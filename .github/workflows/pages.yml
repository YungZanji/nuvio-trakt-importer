name: Deploy Nuvio Trakt Importer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: Verify bundle
        shell: bash
        run: |
          set -o pipefail
          npm run verify:bundle 2>&1 | tee verify.log
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preview-build-diagnostics
          path: |
            build.log
            test.log
            verify.log
          if-no-files-found: ignore
      - name: Upload testable PR preview
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-trakt-importer-preview
          path: _site/index.html
          if-no-files-found: error
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    name: Deploy Nuvio Trakt Importer
    if: github.event_name != 'pull_request'
    environment:
      name: Nuvio Trakt Importer
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Nuvio Trakt Importer
        id: deployment
        uses: actions/deploy-pages@v4
