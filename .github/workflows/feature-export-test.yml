name: Validate Nuvio to Trakt exporter

on:
  push:
    branches: [feature/nuvio-to-trakt-export]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run verify:bundle
